title: Document
author: Chris Mann
version: 0.2.11
quarto-required: ">=1.9.0"
contributes:
  shortcodes:
    - ../base/_shortcodes/toc.lua
    - ../base/_shortcodes/num.lua
    - ../base/_shortcodes/minipage.lua
  project:
    create:
      scaffold: scaffold/create.lua
  formats:
    common:
      date-format: long
      date: today
    html:
      french-quotes: true
      base-format: html
      page-layout: custom
      template: html/layout.html
      theme: none
      csl: ../base/resources/biblio.csl
      css:
        - ../base/html/css/typography.css
        - html/css/styles.css
        - html/css/boilerplate.css
      filters:
        - ../base/_filters/shorthand.lua
        - ../base/_filters/page.lua
        - _filters/validate.lua
        - path: ../base/_filters/toc.lua
          at: post-quarto
    typst:
      base-format: typst
      template-partials:
        - typst/_partials/typst-template.typ
        - typst/_partials/typst-show.typ
      format-resources:
        - typst/quarto-doc.typ
      papersize: a4
      keep-typ: true
      toc: false
      filters:
        - ../base/_filters/page.lua
        - _filters/validate.lua
        - typst/_filters/title.lua
    plain:
      base-format: plain
      template: ../base/plain/layout.txt
      csl: ../base/resources/biblio.csl
      wrap: none
      filters:
        - ../base/_filters/shorthand.lua
        - ../base/_filters/page.lua
        - _filters/validate.lua
        - path: ../base/_filters/floatreftarget.lua
          at: post-quarto
    md:
      base-format: markdown
      toc: false
      template: ../base/md/layout.md
      wrap: none
      tab-stop: 2
      preserve-tabs: false
      variant: +definition_lists
      csl: ../base/resources/biblio.csl
      citeproc: false
      filters:
        - ../base/_filters/shorthand.lua
        - ../base/_filters/page.lua
        - _filters/validate.lua
        - ../base/md/_filters/tables.lua
        - path: ../base/md/_filters/biblio.lua
          at: post-quarto
        - path: ../base/_filters/floatreftarget.lua
          at: post-quarto
    pdf:
      base-format: pdf
      template: pdf/layout.tex
      format-resources:
        - pdf/quarto-doc.cls
        - ../base/pdf/preamble.tex
      papersize: a4
      toc: true
      toc-depth: 7
      lof: true
      lot: true
      number-depth: 5
      number-sections: true
      colorlinks: true
      link-bibliography: true
      link-citations: true
      keep-tex: true
      csl: ../base/resources/biblio.csl
      include-before-body: pdf/_partials/body-before.tex
      include-after-body: pdf/_partials/body-after.tex
      filters:
        - ../latex-environment/latex-environment.lua
        - ../base/_filters/shorthand.lua
        - ../base/_filters/page.lua
        - _filters/validate.lua
        - pdf/_filters/divs.lua
        - path: ../base/_filters/toc.lua
          at: post-quarto
        - path: ../base/_filters/tablerule.lua
          at: post-quarto
  environments:
    - uplist
    - center
